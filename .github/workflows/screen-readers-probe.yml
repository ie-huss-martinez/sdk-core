name: Screen readers probe

# A one-off probe, before the real workflow is written: can GitHub's hosted
# runners run NVDA and VoiceOver through guidepup? It runs only on pushes to
# its own branch, and is deleted before that branch's pull request merges.
on:
  push:
    branches: [ci/real-screen-readers]
    paths:
      - .github/screen-readers/**
      - .github/workflows/screen-readers-probe.yml

permissions:
  contents: read

jobs:
  nvda:
    name: nvda
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: .github/screen-readers/probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up NVDA
        run: |
          npx --no-install guidepup setup --ci
          npx --no-install guidepup install nvda

      # learn-sdk's pass needs a Thai voice. Windows installs voices as the
      # TextToSpeech feature on demand, from Windows Update.
      - name: Try to install a Thai voice
        id: thai
        continue-on-error: true
        shell: pwsh
        run: |
          Get-WindowsCapability -Online -Name "Language.TextToSpeech~~~th-TH*" | Format-List Name, State
          Add-WindowsCapability -Online -Name "Language.TextToSpeech~~~th-TH~0.0.1.0" | Format-List
          Get-WindowsCapability -Online -Name "Language.TextToSpeech~~~th-TH*" | Format-List Name, State
          "OneCore voices:"
          Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Speech_OneCore\Voices\Tokens" | ForEach-Object { $_.PSChildName }
          "SAPI voices:"
          Get-ChildItem "HKLM:\SOFTWARE\Microsoft\Speech\Voices\Tokens" | ForEach-Object { $_.PSChildName }

      - name: NVDA with real Chrome, through Playwright
        continue-on-error: true
        run: npx --no-install playwright test

      - name: NVDA with real Firefox, without Playwright
        run: |
          ls "/c/Program Files/Mozilla Firefox/firefox.exe"
          node native.mjs nvda-firefox

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-nvda
          path: |
            .github/screen-readers/probe/transcript-*.json
            .github/screen-readers/probe/test-results/
          if-no-files-found: warn
          retention-days: 7

  voiceover:
    name: voiceover
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .github/screen-readers/probe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up VoiceOver
        run: |
          sw_vers
          csrutil status || true
          npx --no-install guidepup setup --ci
          npx --no-install guidepup install voiceover

      - name: VoiceOver with real Safari, without Playwright
        run: |
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" /Applications/Safari.app/Contents/Info.plist
          node native.mjs voiceover-safari

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-voiceover
          path: |
            .github/screen-readers/probe/transcript-*.json
            .github/screen-readers/probe/test-results/
          if-no-files-found: warn
          retention-days: 7
