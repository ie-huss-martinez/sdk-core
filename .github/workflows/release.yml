name: Release

# Versions and publishes the packages with Changesets (ADR 0021). Each
# package is versioned and published on its own (ADR 0064).
#
# - With changesets on main, the version job opens or updates the
#   "chore: version packages" pull request.
# - Once that pull request is merged, the plan job finds the versions not yet
#   on npm. The pack job waits for the Verify workflow to have verified those
#   packages on the same commit, then builds, packs and checks their tarballs,
#   with read-only permissions (ADR 0023, ADR 0041, ADR 0064). The publish job
#   publishes exactly those tarballs with trusted publishing and provenance, creates the tags and
#   GitHub Releases, and attaches the tarballs with SHA256SUMS and
#   attestations.
#
# The npm trusted publisher of each package is bound to this repository, this
# file's name and the npm environment, so keep all three.
on:
  push:
    branches: [main]

permissions: {} # each job declares only what it needs

# Never cancel a release in progress; queue the next push behind it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Restricted to main, so the version job only runs there.
    environment: release
    permissions:
      contents: write # push the version commit to the release branch
      pull-requests: write # open and update the version pull request
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # No caches: everything is installed fresh, so a poisoned cache can't
      # reach a release.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --frozen-lockfile

      # A pull request opened with GITHUB_TOKEN doesn't trigger workflows, so
      # it could never pass the required checks; the App's token does.
      - name: Check the release App configuration
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          HAS_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_PRIVATE_KEY" != "true" ]; then
            echo "::error title=Release App not configured::Set the RELEASE_APP_CLIENT_ID variable and the RELEASE_APP_PRIVATE_KEY secret at organisation level, with access for this repository. See CONTRIBUTING.md#setting-up-releases."
            exit 1
          fi

      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Scope the token to what this job needs, whatever the App can do.
          permission-contents: write
          permission-pull-requests: write

      # Without publish-script, the action only versions: it opens or updates
      # the version pull request when there are changesets.
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

  plan:
    name: plan
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # No caches: everything is installed fresh, so a poisoned cache can't
      # reach a release.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --frozen-lockfile

      - id: plan
        name: Plan the release
        run: .github/release/plan.sh

  # Packs exactly what the release publishes, without the release's
  # permissions (ADR 0023, ADR 0041). The tests don't run again here: this job
  # first waits for the Verify workflow to have verified every planned package
  # on this commit, and fails if it can't have. It then builds the planned
  # packages, packs them from the publish plan and checks the tarballs, which
  # is the hard gate before anything publishes.
  pack:
    name: pack release
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: ubuntu-latest
    # Most of it is waiting for Verify, which check-verified.mjs caps at 60
    # minutes.
    timeout-minutes: 80
    permissions:
      contents: read
      actions: read # read the Verify runs on this commit
    env:
      HUSKY: "0"
    # The SHA-256 of the publish plan uploaded with the tarballs, which the
    # publish job checks (ADR 0041).
    outputs:
      packs: ${{ steps.packs.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # No caches: everything is installed fresh, so a poisoned cache can't
      # reach a release.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --frozen-lockfile

      - id: plan
        name: Plan the release
        run: .github/release/plan.sh

      - name: Wait for Verify on this commit
        if: steps.plan.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release/check-verified.mjs "$RUNNER_TEMP/publish-plan.json"

      # Each planned package and what it depends on, so its tarball holds
      # this commit's build.
      - name: Build the packages to publish
        if: steps.plan.outputs.pending == 'true'
        run: |
          filters=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { plannedNames } from "./.github/release/check-verified.mjs"; const plan = JSON.parse(readFileSync(process.argv[1], "utf8")); console.log(plannedNames(plan).map((name) => `--filter=${name}...`).join(" "));' "$RUNNER_TEMP/publish-plan.json")
          # shellcheck disable=SC2086 # one word per filter
          pnpm $filters --if-present build

      # changeset pack rewrites catalog: and workspace: ranges into real
      # versions, and writes the tarballs with a copy of the plan that records
      # each one's integrity.
      - name: Pack the packages
        if: steps.plan.outputs.pending == 'true'
        run: pnpm changeset pack --from-publish-plan "$RUNNER_TEMP/publish-plan.json" --out-dir "$RUNNER_TEMP/release-packs"

      # Every file that package.json points to must be in the tarball, and
      # publint --strict must pass on the tarball itself. publint comes from
      # its own lockfile, installed without scripts.
      - name: Check the tarballs
        if: steps.plan.outputs.pending == 'true'
        run: |
          work="$RUNNER_TEMP/release-publint"
          rm -rf "$work"
          mkdir -p "$work"
          cp .github/release/publint/package.json .github/release/publint/package-lock.json "$work/"
          (cd "$work" && npm ci --ignore-scripts --no-audit --no-fund --loglevel=error)
          node .github/release/check-tarballs.mjs "$RUNNER_TEMP/release-packs" --publint "$work/node_modules/.bin/publint"

      - id: packs
        name: Record the plan's hash
        if: steps.plan.outputs.pending == 'true'
        run: echo "sha256=$(sha256sum "$RUNNER_TEMP/release-packs/publish-plan.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload the tarballs
        if: steps.plan.outputs.pending == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packs
          path: ${{ runner.temp }}/release-packs
          if-no-files-found: error
          retention-days: 1

  # Runs whenever the plan job ran, even if pack failed, so the finishing
  # steps still repair releases left unfinished by earlier runs. It publishes
  # only the tarballs the pack job built, checked and uploaded in this run,
  # and never builds or packs, so no package's build code runs where the OIDC
  # token is.
  publish:
    name: publish
    needs: [version, plan, pack]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write # push tags, create GitHub Releases and upload their files
      id-token: write # npm trusted publishing and provenance, through OIDC
      attestations: write # create the artifact attestations
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No registry-url: trusted publishing needs no token or .npmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # No caches in a job that publishes.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - run: pnpm install --frozen-lockfile

      # The plan again, here, because the publishing steps write their
      # results into it. Every release file goes to $RUNNER_TEMP, outside the
      # checkout.
      - id: plan
        name: Plan the release
        run: .github/release/plan.sh

      - name: Check the npm version
        if: steps.plan.outputs.pending == 'true'
        run: |
          required=11.5.1
          current=$(npm --version)
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n 1)" != "$required" ]; then
            echo "::error::npm $current is too old for trusted publishing; $required or newer is needed."
            exit 1
          fi

      # Never publish what the pack job didn't verify, pack and check. The
      # finishing steps below still run.
      - name: Check that this release was verified
        if: steps.plan.outputs.pending == 'true'
        env:
          VERIFIED: ${{ needs.pack.result }}
        run: |
          if [ "$VERIFIED" != "success" ]; then
            echo "::error title=Release not verified::The pack job's result is \"$VERIFIED\", so nothing is published. Fix the cause, then re-run the workflow."
            exit 1
          fi

      - name: Download the verified tarballs
        if: steps.plan.outputs.pending == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packs
          path: ${{ runner.temp }}/release-packs

      # The downloaded plan must be the one the pack job recorded, so each
      # tarball's integrity, which publish-packages.mjs checks, chains back to
      # the pack job. It must also plan the same versions as this job, and
      # every file the packages point to must be in their tarballs.
      - name: Check the verified tarballs
        if: steps.plan.outputs.pending == 'true'
        env:
          PACKS: ${{ needs.pack.outputs.packs }}
        run: |
          packs="$RUNNER_TEMP/release-packs"
          actual=$(sha256sum "$packs/publish-plan.json" | cut -d ' ' -f 1)
          if [ -z "$PACKS" ] || [ "$actual" != "$PACKS" ]; then
            echo "::error title=Unverified tarballs::The downloaded publish plan's SHA-256 is $actual, but the pack job recorded \"$PACKS\", so nothing is published."
            exit 1
          fi
          versions='[.plan[][] | select(.kind == "publish") | "\(.name)@\(.version)"] | sort'
          if [ "$(jq -c "$versions" "$packs/publish-plan.json")" != "$(jq -c "$versions" "$RUNNER_TEMP/publish-plan.json")" ]; then
            echo "::error title=Different release::The pack job packed $(jq -c "$versions" "$packs/publish-plan.json"), but this job plans $(jq -c "$versions" "$RUNNER_TEMP/publish-plan.json"), so nothing is published. Re-run the workflow."
            exit 1
          fi
          node .github/release/check-tarballs.mjs "$packs"

      # Pure trusted publishing: no npm token exists for this repository. A
      # package whose trusted publisher doesn't name this repository fails
      # here, and the others still publish.
      - id: changesets
        if: steps.plan.outputs.pending == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          PUBLISHED_RECORD: ${{ runner.temp }}/published.ndjson
          NPM_PUBLISH_COMMAND: publish
        with:
          publish-script: node .github/release/publish-packages.mjs ${{ runner.temp }}/release-packs
          create-github-releases: true

      # Finishes every version released from this repository that's on npm
      # but whose GitHub Release lacks its files: the ones this run published,
      # even if another package failed, and any left unfinished by an earlier
      # run. Complete releases, and versions released from a package's old
      # repository, are left alone.
      - id: finish
        name: Prepare the release files
        if: ${{ !cancelled() && steps.plan.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_RECORD: ${{ runner.temp }}/published.ndjson
          PUBLISH_PLAN: ${{ runner.temp }}/publish-plan.json
        run: node .github/release/finish-releases.mjs prepare "$RUNNER_TEMP/release-assets"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !cancelled() && steps.finish.outputs.count > 0 }}
        with:
          subject-path: ${{ runner.temp }}/release-assets/*/*.tgz

      - name: Attach the files to each GitHub Release
        if: ${{ !cancelled() && steps.finish.outputs.count > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release/finish-releases.mjs attach "$RUNNER_TEMP/release-assets"
