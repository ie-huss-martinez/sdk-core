<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The family's font rules for browser tests (sdk-core ADR 0062). In the
  pinned browser test image, "system-ui" and the generic families resolve to
  a font with one style, so strong text is drawn like regular text. These
  rules keep the system's configuration and prefer the Liberation fonts the
  image already has, each in regular, bold, italic and bold italic.

  The presets pass this file to the browsers they launch, as FONTCONFIG_FILE,
  through fontLaunchEnv() in @hussmartinez/sdk-config/testing/fonts.
-->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>ui-monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
</fontconfig>
