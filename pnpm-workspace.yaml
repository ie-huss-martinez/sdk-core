packages:
  - packages/*
  # Each package's example applications, end-to-end suite and, for ui, its
  # component catalogue: unpublished, and built against the package beside them.
  - packages/*/examples/*
  - packages/*/e2e
  - packages/*/apps/*

# One version of each tool for the whole workspace. Packages refer to these
# with `catalog:`, and pnpm writes the real ranges into published manifests.
catalog:
  ajv: ^8.20.0
  "@arethetypeswrong/cli": ^0.18.5
  axe-core: ^4.11.0
  "@axe-core/playwright": ^4.14.0
  "@biomejs/biome": ^2.6.8
  "@cantoo/pdf-lib": 2.11.1
  "@changesets/changelog-github": ^1.0.1
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.4
  "@commitlint/config-conventional": ^21.2.4
  "@commitlint/lint": ^21.2.4
  "@commitlint/load": ^21.2.4
  "@commitlint/types": ^21.2.3
  dependency-cruiser: ^18.7.2
  esbuild: ^0.28.2
  fast-check: ^4.10.2
  gifenc: 1.0.3
  "@guidepup/virtual-screen-reader": 0.33.0
  husky: ^9.1.7
  lint-staged: ^17.6.1
  lucide-static: 1.73.0
  mediabunny: 1.66.0
  "@microsoft/api-extractor": ^7.60.1
  next: ^16.4.6
  pdfjs-dist: 6.5.438
  pdfstudio: 0.4.0
  perfect-freehand: 1.2.3
  picomatch: ^4.0.7
  playwright: 1.65.1
  "@playwright/test": 1.65.1
  postcss: ^8.5.33
  postcss-selector-parser: ^7.2.1
  postcss-value-parser: ^4.2.0
  publint: ^0.3.25
  react: ^19.3.0
  react-18: npm:react@18.3.1
  react-dom: ^19.3.0
  react-dom-18: npm:react-dom@18.3.1
  secretlint: ^13.1.0
  "@secretlint/node": ^13.1.0
  "@secretlint/secretlint-rule-preset-recommend": ^13.1.0
  size-limit: ^14.3.0
  "@size-limit/esbuild": ^14.3.0
  "@size-limit/file": ^14.3.0
  storybook: ^10.6.7
  "@storybook/addon-a11y": ^10.6.7
  "@storybook/addon-docs": ^10.6.7
  "@storybook/addon-vitest": ^10.6.7
  "@storybook/react-vite": ^10.6.7
  stylelint: ^18.0.0
  ts-fsrs: 6.0.0
  "@types/node": ^24.19.2
  "@types/picomatch": ^4.0.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  typescript: ^6.0.3
  vite: ^8.3.8
  vitest: ^5.1.0
  "@vitest/browser": 5.1.0
  "@vitest/browser-playwright": 5.1.0
  workerd: 1.20261116.1
  yaml: ^2.9.1
  # ESLint runs React's hooks plugin and nothing else (ADR 0063). Pinned exactly.
  "@typescript-eslint/parser": 8.73.0
  eslint: 10.15.0
  eslint-plugin-react-hooks: 7.1.1

# Supply-chain hardening (ADR 0012).
# Dependency install scripts are blocked unless allowlisted here.
# esbuild's (a devDependency of sdk-core's tree-shaking test) only checks its
# platform binary, which works without it, so it's denied explicitly.
allowBuilds:
  esbuild: false
  # Image tooling that Next.js and Wrangler bring to the examples; neither needs its build.
  sharp: false
  workerd: false
# Fail the install when an unapproved package wants to run a build script.
strictDepBuilds: true
# Don't resolve versions published less than a day ago, except the family's
# own, which provenance, trustPolicy and the reviewer's check cover (ADR 0044).
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@hussmartinez/*"
# Refuse a version with weaker publish provenance than an earlier one.
trustPolicy: no-downgrade
# Transitive dependencies must come from the registry, not git or tarball URLs.
blockExoticSubdeps: true

# Transitive versions forced past a known advisory, each with when to remove it.
overrides:
  # GHSA-g3hv-75wg-m249, fixed in minimatch 11.0.1. API Extractor, up to
  # 7.60.1, pins minimatch 10.2.3. It calls only minimatch(name, pattern),
  # for bundledPackages, which neither package's configuration sets. Remove
  # once API Extractor depends on minimatch 11.
  "@microsoft/api-extractor>minimatch": ^11.0.1
  # GHSA-3g3m-2fjr-6pw4, fixed in glob 14.0.2. Storybook's react-vite
  # framework, up to 10.6.7, pins this plugin to 0.7, which depends on
  # glob 13. The plugin calls only globSync with options glob 14 keeps.
  # Remove once @storybook/react-vite depends on a plugin without glob 13,
  # such as 0.9, which uses tinyglobby.
  "@joshwooding/vite-plugin-react-docgen-typescript>glob": ^14.0.2
